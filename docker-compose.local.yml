services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: equitab_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "8080:8080"
    networks:
      - equitab_network

  # Même chose qu'en prod (voir docker-compose.yml) : sans ce conteneur, les
  # jobs mis en queue (remboursement auto 48h, recalcul des prix) ne
  # s'exécutent jamais avec QUEUE_CONNECTION=database.
  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: equitab_queue_worker_local
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    entrypoint: ["docker/entrypoint-worker.sh"]
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    depends_on:
      - postgres
      - redis
    networks:
      - equitab_network

  # Idem pour le planificateur (rappels, sitemap, réconciliation des
  # paiements toutes les 15 min...).
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: equitab_scheduler_local
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    entrypoint: ["docker/entrypoint-worker.sh"]
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      - postgres
      - redis
    networks:
      - equitab_network

  nginx:
    image: nginx:alpine
    container_name: equitab_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - equitab_network

  postgres:
    image: postgres:16-alpine
    container_name: equitab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: equitab
      POSTGRES_USER: equitab
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    networks:
      - equitab_network

  redis:
    image: redis:7-alpine
    container_name: equitab_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - equitab_network

volumes:
  postgres_data_local:

networks:
  equitab_network:
    driver: bridge
