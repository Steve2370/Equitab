services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: equitab_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "8080:8080"
    networks:
      - equitab_network

  nginx:
    image: nginx:alpine
    container_name: equitab_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - equitab_network

  postgres:
    image: postgres:16-alpine
    container_name: equitab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: equitab
      POSTGRES_USER: equitab
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    networks:
      - equitab_network

  redis:
    image: redis:7-alpine
    container_name: equitab_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - equitab_network

volumes:
  postgres_data_local:

networks:
  equitab_network:
    driver: bridge
